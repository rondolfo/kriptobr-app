name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar o APK de teste
        run: source ./escolher-projeto.sh && gradle -p "$PROJETO" :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p entrega
          cp "$PROJETO/app/build/outputs/apk/debug/app-debug.apk" entrega/KriptoBR-Mercado.apk
          ls -lh entrega

      - name: Guardar como anexo do build
        uses: actions/upload-artifact@v4
        with:
          name: apk-teste
          path: entrega/*.apk
          retention-days: 30

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: KriptoBR Mercado v2.0.${{ github.run_number }}
          body: APK de teste gerado automaticamente. Baixe o arquivo .apk abaixo pelo celular e toque nele para instalar.
          files: entrega/*.apk
          draft: false
          prerelease: false
